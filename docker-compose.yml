services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lura
      POSTGRES_PASSWORD: lura
      POSTGRES_DB: lura
    ports:
      - "5432:5432"
    volumes:
      - lura_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lura -d lura"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lura_postgres:
